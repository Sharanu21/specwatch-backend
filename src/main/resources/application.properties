
server.port=${PORT:8080}

# DataSource is configured programmatically in DataSourceConfig.java
# Supports both Render-style (DB_URL / DB_USERNAME / DB_PASSWORD)
# and Replit/local style (PGHOST / PGPORT / PGDATABASE / PGUSER / PGPASSWORD)
app.base-url=${APP_BASE_URL:https://specwatch.netlify.app}
management.endpoints.web.exposure.include=health
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:notifications@specwatch.dev}
github.api.base-url=https://api.github.com
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


jwt.secret=${JWT_SECRET:specwatch_super_secret_key_minimum_32_chars_ok}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===========================
# GITHUB
# ===========================
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}

# ===========================
# APP
# ===========================
app.frontend.url=${FRONTEND_URL:http://localhost:5000}
specwatch.free.max.repos=1
specwatch.team.max.repos=10

# ===========================
# OAUTH2
# ===========================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:placeholder-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:placeholder-secret}
spring.security.oauth2.client.registration.github.scope=user:email,read:user


# ===========================
# SECURITY
# ===========================
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
