services:
  - type: web
    name: specwatch-backend
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/specwatch-backend-0.0.1-SNAPSHOT.jar
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: JAVA_VERSION
        value: "17"
      # JWT — set a strong random secret (32+ chars)
      - key: JWT_SECRET
        sync: false
      # Database — copy these from your Render PostgreSQL instance
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      # CORS — set to your Netlify URL e.g. https://specwatch.netlify.app
      - key: FRONTEND_URL
        sync: false
      # Email base URL for links in alert emails
      - key: APP_BASE_URL
        sync: false
      # Optional — email alerts via Resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      # Optional — GitHub token for reading private repo specs
      - key: GITHUB_TOKEN
        sync: false
      # Optional — HMAC signature verification for GitHub webhooks
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
